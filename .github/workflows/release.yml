name: release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'version.txt'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - id: ver
        shell: pwsh
        run: |
          $v = (Get-Content version.txt -Raw).Trim()
          "version=$v" >> $env:GITHUB_OUTPUT

      - shell: pwsh
        run: |
          dotnet publish src/Luna/Luna.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:Version=${{ steps.ver.outputs.version }} `
            -o publish

      - id: zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath Luna-win-x64.zip
          $h = (Get-FileHash Luna-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "sha=$h" >> $env:GITHUB_OUTPUT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: Luna-win-x64.zip
          generate_release_notes: true

      - shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $h = '${{ steps.zip.outputs.sha }}'
          $data = [ordered]@{
            version = $v
            url     = "https://github.com/Frivolus/Luna/releases/download/v$v/Luna-win-x64.zip"
            sha256  = $h
          }
          $data | ConvertTo-Json | Set-Content -Path update.json -Encoding utf8
          git config user.name 'github-actions'
          git config user.email 'github-actions@github.com'
          git add update.json
          git commit -m "maj update.json $v"
          git push